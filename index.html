<!DOCTYPE html>
<html lang="ceb">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Breaking Chain Ministry | Equipping Center</title>
    
    <!-- BCM Handbook App Icon / Install -->
    <link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#06080c">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="BCM Handbook">

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* 🏠 MAIN GAMING PLATFORM STRUCTURE LAYOUT */
        body { 
            font-family: 'Outfit', sans-serif; 
            background-color: #06080c;
            color: #e2e8f0; 
            min-height: 100vh; 
            overflow-x: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            line-height: 1.7;
        }

        /* --- FIXED & LOCKED: HIGH-IMPACT CYBER-CINEMATIC TANTRA BACKGROUND --- */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                rgba(6, 8, 12, 0.55) 0%, 
                rgba(6, 8, 12, 0.70) 50%, 
                rgba(6, 8, 12, 0.90) 100%
            ), url('tantra.png?v=2') no-repeat center center;
            background-size: cover;
            filter: contrast(1.22) brightness(0.85) saturate(1.15);
            z-index: -2;
            pointer-events: none;
        }

        /* ✨ REAL-TIME ANINIPOT GLOBAL LAYOUT CONTAINER */
        #aninipot_container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }

        .aninipot {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            animation: riseAndTwinkle 15s infinite ease-in-out;
        }

        .aninipot.gold {
            background: radial-gradient(circle, #fff700 0%, #ff8c00 70%);
            box-shadow: 0 0 15px #ffd700, 0 0 30px #ff8c00;
        }

        .aninipot.cyan {
            background: radial-gradient(circle, #00fff2 0%, #0055ff 70%);
            box-shadow: 0 0 15px #00fff2, 0 0 30px #0055ff;
        }

        @keyframes riseAndTwinkle {
            0% { transform: translateY(105vh) scale(0.6); opacity: 0; }
            20% { opacity: 0.8; }
            50% { opacity: 0.4; }
            80% { opacity: 0.9; }
            100% { transform: translateY(-10vh) scale(1.3); opacity: 0; }
        }

        /* 🌐 TRANSLATE BAR INTERFACE HUB */
        #translate_container { 
            width: 100%; 
            display: flex; 
            justify-content: flex-start; 
            padding: 20px 20px 0 20px; 
            box-sizing: border-box; 
            z-index: 10; 
        }
        #translate_wrapper { 
            background: rgba(13, 17, 26, 0.95); 
            padding: 10px 20px; 
            border-radius: 30px; 
            border: 2px solid #d4af37; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }
        #translate_wrapper span { 
            color: #ffd700; 
            font-family: 'Orbitron', sans-serif; 
            font-size: 0.85rem; 
            font-weight: 900; 
            text-transform: uppercase; 
            letter-spacing: 1px;
        }
        .goog-te-banner-frame.skiptranslate { display: none !important; }
        body { top: 0px !important; }

        /* --- IMMERSIVE PLATFORM HEADER CONTROL --- */
        header { text-align: center; margin-top: 15px; margin-bottom: 40px; z-index: 2; padding: 0 15px; }
        
        .logo-container {
            margin: 0 auto 20px auto;
            max-width: 160px;
            width: 100%;
        }
        .main-logo {
            width: 100%;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.4));
            transition: transform 0.4s ease;
        }
        .main-logo:hover {
            transform: scale(1.05);
            filter: drop-shadow(0 0 25px rgba(255, 77, 77, 0.6));
        }

        @keyframes gamingRGB {
            0% { color: #ff3333; filter: drop-shadow(0 0 8px rgba(255, 51, 51, 0.6)); }
            20% { color: #33ff33; filter: drop-shadow(0 0 8px rgba(51, 255, 51, 0.6)); }
            40% { color: #3333ff; filter: drop-shadow(0 0 8px rgba(51, 51, 255, 0.6)); }
            60% { color: #cc33ff; filter: drop-shadow(0 0 8px rgba(204, 51, 255, 0.6)); }
            80% { color: #ffff33; filter: drop-shadow(0 0 8px rgba(255, 255, 51, 0.6)); }
            100% { color: #ff3333; filter: drop-shadow(0 0 8px rgba(255, 51, 51, 0.6)); }
        }

        header h1 { 
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(28px, 5vw, 46px); 
            text-transform: uppercase; 
            margin: 0; 
            font-weight: 900;
            letter-spacing: 2px;
            animation: gamingRGB 8s infinite linear;
        }
        header p {
            font-size: clamp(16px, 3.5vw, 22px);
            color: #dfd3c3;
            margin-top: 8px;
            letter-spacing: 1.5px;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.9);
        }

        /* 🎮 PREMIUM CHROMATIC GLOWING PLATFORM GRID CONTAINER */
        .container { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); 
            gap: 30px; 
            width: 95%; 
            max-width: 1300px; 
            margin: 0 auto; 
            padding-bottom: 120px; 
            z-index: 2;
        }

        /* 🌈 INTERACTIVE CARD TERMINAL STRUTS */
        .card-glow-wrapper {
            position: relative;
            border-radius: 18px;
            padding: 2px; 
            background: linear-gradient(45deg, #ff4500, #00fff2, #d400ff, #ffd700);
            background-size: 400% 400%;
            animation: chromaticShift 8s infinite linear;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7);
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            height: 100%;
            overflow: hidden;
        }

        .card-glow-wrapper:hover {
            transform: translateY(-12px) scale(1.03);
            box-shadow: 0 20px 45px rgba(255, 215, 0, 0.3), 0 0 35px rgba(0, 255, 242, 0.3);
        }

        @keyframes chromaticShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* High-Impact Laser Flare Shimmer Engine */
        .card-glow-wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            left: -150%;
            width: 100px; 
            height: 100%;
            background: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.8) 50%, 
                rgba(255, 255, 255, 0) 100%
            );
            transform: skewX(-35deg); 
            animation: cardGlint 4s infinite ease-in-out;
            pointer-events: none;
            z-index: 5;
        }

        @keyframes cardGlint {
            0% { left: -150%; }
            40% { left: 150%; }
            100% { left: 150%; }
        }
        
        .folder { 
            background: linear-gradient(135deg, #0d121c 0%, #05070a 100%); 
            border-radius: 16px; 
            padding: 35px 20px; 
            text-align: center; 
            position: relative; 
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 240px;
            width: 100%;
            height: 100%;
        }

        /* ✨ INTERNAL SPIRITUAL SPARK POWER LAYER */
        .card-spark {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            animation: sparkFloat 4s infinite linear;
            z-index: 1;
        }

        @keyframes sparkFloat {
            0% { transform: translateY(40px) scale(0.3); opacity: 0; }
            30% { opacity: 0.8; }
            70% { opacity: 0.8; }
            100% { transform: translateY(-80px) scale(1.2); opacity: 0; }
        }
        
        /* Icon Pack Setup nodes */
        .folder::before { 
            content: "👑"; 
            font-size: 2.6rem; 
            display: block; 
            margin-bottom: 14px; 
            opacity: 0.7; 
            transition: 0.3s;
            z-index: 2;
        }
        .container a:nth-child(1) .folder::before { content: "⚡"; text-shadow: 0 0 12px #00fff2; }
        .container a:nth-child(2) .folder::before { content: "🔥"; text-shadow: 0 0 12px #ff4500; }
        .container a:nth-child(3) .folder::before { content: "🛡️"; text-shadow: 0 0 12px #ffd700; }
        .container a:nth-child(4) .folder::before { content: "⚔️"; text-shadow: 0 0 12px #d400ff; }
        .container a:nth-child(5) .folder::before { content: "📢"; text-shadow: 0 0 12px #00ff66; }

        .card-glow-wrapper:hover .folder::before {
            opacity: 1;
            transform: scale(1.2) rotate(-5deg);
        }

        .folder h2 { 
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem; 
            color: #ffffff;
            margin: 0 0 15px 0; 
            font-weight: 900;
            letter-spacing: 0.5px;
            transition: 0.3s;
            z-index: 2;
        }
        .card-glow-wrapper:hover h2 {
            color: #ffd700;
            text-shadow: 0 0 12px rgba(212, 175, 55, 0.6);
        }

        .folder p { 
            color: #ffaa00; 
            font-weight: 900; 
            font-family: 'Orbitron', sans-serif;
            background: rgba(0, 0, 0, 0.6); 
            border: 2px solid rgba(212, 175, 55, 0.4);
            padding: 6px 18px; 
            border-radius: 20px; 
            display: inline-block; 
            font-size: 0.85rem;
            letter-spacing: 1px;
            transition: 0.3s;
            z-index: 2;
            text-transform: uppercase;
        }
        .card-glow-wrapper:hover p {
            background: linear-gradient(135deg, #ff4500, #ff8c00);
            color: #ffffff;
            border-color: #ff4d4d;
            box-shadow: 0 0 15px #ff4d4d;
        }
        
        /* 🔒 SECURE LOGIN OVERLAY INTERFACE CELL BLOCK */
        #loginOverlay { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            background: linear-gradient(rgba(6, 8, 12, 0.96), rgba(13, 16, 23, 0.99)); 
            z-index: 9999; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            backdrop-filter: blur(15px); 
        }
        .login-card { 
            background: rgba(13, 17, 26, 0.98); 
            border: 2px solid #d4af37; 
            padding: 40px; 
            border-radius: 20px; 
            width: 90%; 
            max-width: 420px; 
            text-align: center; 
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.3); 
            position: relative;
            overflow: hidden;
        }
        .login-card h2 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            letter-spacing: 1px;
            color: #ffd700;
            font-size: 1.6rem;
            margin-bottom: 5px;
        }
        .input-group { margin-bottom: 22px; text-align: left; }
        .input-group label { display: block; color: #ffd700; margin-bottom: 6px; font-weight: 700; font-family: 'Orbitron', sans-serif; font-size: 0.85rem; letter-spacing: 0.5px; }
        .input-group input { width: 100%; padding: 14px; border-radius: 8px; border: 1px solid rgba(212, 175, 55, 0.5); background: #070a10; color: #fff; box-sizing: border-box; font-family: 'Outfit', sans-serif; font-size: 16px; outline: none; transition: border-color 0.3s; }
        .input-group input:focus { border-color: #ff4d4d; box-shadow: 0 0 10px rgba(255, 77, 77, 0.3); }
        
        .login-btn { 
            width: 100%; 
            padding: 15px; 
            background: linear-gradient(135deg, #d4af37 0%, #b8901c 100%); 
            border: 1px solid #d4af37; 
            border-radius: 8px; 
            font-weight: 900; 
            font-family: 'Orbitron', sans-serif;
            cursor: pointer; 
            text-transform: uppercase; 
            margin-top: 10px; 
            transition: 0.3s; 
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }
        .login-btn:hover { background: #fff; color: #111; box-shadow: 0 0 25px #fff; border-color: #fff; }

        /* 🚪 PREMIUM LOG OUT CONTROL TERMINAL STRUT */
        .logout-btn { 
            position: fixed; bottom: 25px; right: 25px; 
            background: linear-gradient(135deg, #ff4500, #ff8c00); 
            color: white; border: none; padding: 14px 28px; 
            border-radius: 30px; font-weight: 900; cursor: pointer; 
            z-index: 999; box-shadow: 0 4px 20px rgba(255, 69, 0, 0.4);
            font-family: 'Orbitron', sans-serif; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 1px solid #ff4500;
        }
        .logout-btn:hover { 
            transform: scale(1.06) translateY(-2px); 
            background: linear-gradient(135deg, #ff5722, #ff4500);
            box-shadow: 0 6px 25px #ff4500;
            border-color: #fff;
        }

        /* High-Impact Interactive Ripple FX Element Structure */
        .gaming-ripple-effect {
            position: fixed;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: transparent;
            border: 3px solid #ff4d4d;
            box-shadow: 0 0 15px #ff4d4d, inset 0 0 15px #ff4d4d;
            pointer-events: none;
            z-index: 2000;
            opacity: 0;
            transform: translate(-50%, -50%) scale(1);
        }
        .gaming-ripple-effect.active {
            animation: burstRipple 0.6s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes burstRipple {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.9; border-color: #ff4d4d; box-shadow: 0 0 10px #ff4d4d; }
            50% { border-color: #d4af37; box-shadow: 0 0 25px #d4af37; }
            100% { transform: translate(-50%, -50%) scale(8); opacity: 0; border-color: #00d2ff; }
        }

        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; width: 92%; gap: 20px; }
            .logout-btn { bottom: 15px; right: 15px; padding: 12px 22px; font-size: 12px; }
        }
    </style>
</head>
<body id="main-body">

    <!-- System Interactive Ripple Node Engine Overlay -->
    <div id="gaming-effect" class="gaming-ripple-effect"></div>

    <!-- 3D Global Tantra Background Layer Packs -->
    <div class="bg-overlay"></div>
    <div id="aninipot_container"></div>

    <div id="translate_container">
        <div id="translate_wrapper">
            <span>🌐 Wika:</span>
            <div id="google_translate_element"></div>
        </div>
    </div>

    <header>
        <div class="logo-container">
            <img src="bcm.png" alt="Breaking Chain Ministry Logo" class="main-logo">
        </div>
        <h1>Breaking Chain Ministry</h1>
        <p>Equipping the Saints</p>
    </header>

    <div class="container">
        <!-- CARD 1 -->
        <a href="cellexplosion.html" style="text-decoration:none;">
            <div class="card-glow-wrapper">
                <div class="folder" id="card_cell">
                    <h2>Cell Explosion</h2>
                    <p>1-12 Lessons</p>
                </div>
            </div>
        </a>
        
        <!-- CARD 2 -->
        <a href="breakeverychain.html" style="text-decoration:none;">
            <div class="card-glow-wrapper">
                <div class="folder" id="card_break">
                    <h2>Break Every Chain</h2>
                    <p>1-20 Lessons</p>
                </div>
            </div>
        </a>
        
        <!-- CARD 3 -->
        <a href="discipleship.html" style="text-decoration:none;">
            <div class="card-glow-wrapper">
                <div class="folder" id="card_disc">
                    <h2>Discipleship</h2>
                    <p>1-12 Lessons</p>
                </div>
            </div>
        </a>
        
        <!-- CARD 4 -->
        <a href="leadership.html" style="text-decoration:none;">
            <div class="card-glow-wrapper">
                <div class="folder" id="card_lead">
                    <h2>Leadership</h2>
                    <p>1-12 Lessons</p>
                </div>
            </div>
        </a>

        <!-- CARD 5: EVANGELISM -->
        <a href="evangelism.html" style="text-decoration:none;">
            <div class="card-glow-wrapper">
                <div class="folder" id="card_evang">
                    <h2>Evangelism</h2>
                    <p>1-12 Series</p>
                </div>
            </div>
        </a>
    </div>

    <button class="logout-btn" onclick="portalLogOut()">🚪 Log Out sa Trono</button>

    <!-- SECURITY BARRIER OVERLAY -->
    <div id="loginOverlay">
        <div class="login-card">
            <h2>BREAKING CHAIN MINISTRY</h2>
            <div style="margin-bottom:25px; color:#dfd3c3; font-style:italic; font-family: 'Outfit', sans-serif;">Equipping the Saints Portal</div>
            <div class="input-group"><label>Username</label><input type="text" id="portalUser" placeholder="Ibutang ang imong ngalan"></div>
            <div class="input-group"><label>Access Code</label><input type="password" id="portalCode" placeholder="Ibutang ang imong Code No."></div>
            <button class="login-btn" onclick="checkPortalAccess()">MOSULOD SA TRONO</button>
            <div style="margin-top:25px; font-size:0.9rem; font-family: 'Outfit', sans-serif;">
                <a href="#" onclick="changePassword()" style="color:#ffd700; text-decoration:none; font-weight:600;">🔄 Change Code No.</a><br><br>
                <a href="admin_dashboard.html" style="color:rgba(255,255,255,0.4); text-decoration:none;">🔐 Admin Dashboard Control</a>
            </div>
        </div>
    </div>

    <script type="text/javascript">
        function googleTranslateElementInit() { 
            new google.translate.TranslateElement({pageLanguage: 'ceb', includedLanguages: 'en,tl,ceb', autoDisplay: false}, 'google_translate_element'); 
        }
        
        /* 🌌 AUTOMATIC MULTI-COLORED ANINIPOT GENERATOR ENGINE */
        document.addEventListener("DOMContentLoaded", function() {
            const container = document.getElementById("aninipot_container");
            const particleCount = 45;
            const colors = ['gold', 'cyan'];

            for (let i = 0; i < particleCount; i++) {
                let particle = document.createElement("div");
                let randomColor = colors[Math.floor(Math.random() * colors.length)];
                particle.className = `aninipot ${randomColor}`;
                
                let size = Math.random() * 6 + 4;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${Math.random() * 100}vw`;
                particle.style.top = `${Math.random() * 100}vh`;
                particle.style.animationDelay = `${Math.random() * 15}s`;
                particle.style.animationDuration = `${Math.random() * 10 + 10}s`;
                
                container.appendChild(particle);
            }

            /* ✨ INTERNAL SPIRITUAL SPARK SPAWNER FOR EACH CARD */
            const cardIds = ['card_cell', 'card_break', 'card_disc', 'card_lead', 'card_evang'];
            const sparkColors = ['#00fff2', '#ff4500', '#ffd700', '#d400ff', '#00ff66'];

            cardIds.forEach((id, index) => {
                const cardNode = document.getElementById(id);
                if (cardNode) {
                    const internalSparkCount = 8;

                    for (let j = 0; j < internalSparkCount; j++) {
                        let spark = document.createElement("div");
                        spark.className = "card-spark";
                        
                        let sparkSize = Math.random() * 4 + 2;
                        spark.style.width = `${sparkSize}px`;
                        spark.style.height = `${sparkSize}px`;
                        spark.style.left = `${Math.random() * 80 + 10}%`;
                        spark.style.bottom = `${Math.random() * 30}%`;
                        
                        spark.style.background = sparkColors[index];
                        spark.style.boxShadow = `0 0 10px ${sparkColors[index]}, 0 0 20px ${sparkColors[index]}`;
                        
                        spark.style.animationDelay = `${Math.random() * 4}s`;
                        spark.style.animationDuration = `${Math.random() * 3 + 2}s`;
                        
                        cardNode.appendChild(spark);
                    }
                }
            });
        });

        var defaultLeaders = [
            { name: "Pastor Frank", code: "7777", active: true }, { name: "Jenelyn", code: "1403", active: true },
            { name: "Argie", code: "4444", active: true }, { name: "Rosemarie", code: "0001", active: true },
            { name: "Pastor Jessie", code: "0002", active: true }, { name: "Julibeth", code: "0003", active: true },
            { name: "Abraham", code: "0004", active: true }, { name: "John Jersey", code: "0005", active: true },
            { name: "Faith", code: "3333", active: true }, { name: "Aga", code: "0006", active: true },
            { name: "Jenefer", code: "0007", active: true }, { name: "Roland", code: "0008", active: true },
            { name: "Raymund", code: "0009", active: true }, { name: "Lilibeth", code: "0010", active: true },
            { name: "Leader", code: "0000", active: true }, { name: "Disciple", code: "0011", active: true },
            { name: "Vince Elijah", code: "1234", active: true }
        ];
        
        if (localStorage.getItem('leadersListFinal') === null) { localStorage.setItem('leadersListFinal', JSON.stringify(defaultLeaders)); }

        function checkPortalAccess() { 
            var user = document.getElementById('portalUser').value.trim();
            var code = document.getElementById('portalCode').value.trim();
            var list = JSON.parse(localStorage.getItem('leadersListFinal'));
            var match = list.find(l => l.name.toLowerCase() === user.toLowerCase() && l.code === code);
            if(match) { document.getElementById('loginOverlay').style.display = 'none'; sessionStorage.setItem('portalApproved', 'true'); }
            else { alert("Sayop ang Username o Code!"); }
        }

        function portalLogOut() { sessionStorage.removeItem('portalApproved'); window.location.reload(); }
        window.addEventListener('DOMContentLoaded', () => { if (sessionStorage.getItem('portalApproved') === 'true') document.getElementById('loginOverlay').style.display = 'none'; });

        const bodyElement = document.getElementById('main-body');
        const gamingEffectElement = document.getElementById('gaming-effect');

        function triggerGamingRipple(e) {
            let clickX, clickY;
            if (e.type === 'touchstart') {
                clickX = e.touches[0].clientX;
                clickY = e.touches[0].clientY;
            } else {
                clickX = e.clientX;
                clickY = e.clientY;
            }

            gamingEffectElement.style.left = clickX + 'px';
            gamingEffectElement.style.top = clickY + 'px';

            gamingEffectElement.classList.remove('active');
            void gamingEffectElement.offsetWidth; 
            gamingEffectElement.classList.add('active');
        }

        bodyElement.addEventListener('click', triggerGamingRipple);
